[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openbb-h1news"
version = "0.1.0"
description = "OpenBB Platform provider extension for the H1 News API (company and world news with sentiment)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["openbb-core>=1.3", "h1news>=0.1"]

[project.entry-points."openbb_provider_extension"]
h1news = "openbb_h1news:h1news_provider"

[tool.hatch.build.targets.wheel]
packages = ["openbb_h1news"]
