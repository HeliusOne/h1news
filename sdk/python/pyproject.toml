[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "h1news"
version = "0.1.0"
description = "Python client for the H1 News API — real-time, ticker-tagged, sentiment-scored financial news over REST and WebSocket."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "HeliusOne", email = "support@heliusone.com" }]
keywords = ["finance", "news", "stocks", "sentiment", "websocket", "trading", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["httpx>=0.27", "websockets>=12"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.11"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://heliusone.com/newsapi"
Documentation = "https://api.heliusone.com/docs"
Source = "https://github.com/HeliusOne/h1news/tree/main/sdk/python"

[tool.hatch.build.targets.wheel]
packages = ["h1news"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
