name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "sdk/python[dev]" -e sdk/mcp build twine
      - run: pytest -q sdk/python/tests
      - run: python -c "import h1news_mcp.server"
      - run: python -m build sdk/python && python -m build sdk/mcp && twine check sdk/python/dist/* sdk/mcp/dist/*
      - run: python -m py_compile examples/*.py examples/integrations/*.py scripts/gen_postman.py

  typescript:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && npm pack --dry-run
